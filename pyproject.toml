[project]
name = "data-input-agent-demo"
version = "0.1.0"
description = "A minimal local-model agent that turns unstructured PDF notices into validated CSV rows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
